[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    # Starlette 1.x deprecates the bundled httpx TestClient transport; the
    # replacement (httpx2) is not a dependency yet and this is not our warning.
    ignore::DeprecationWarning:starlette.*
    ignore:.*httpx.*:DeprecationWarning
    # Alembic asks for path_separator in alembic.ini; harmless for local dev.
    ignore:.*path_separator.*:DeprecationWarning
